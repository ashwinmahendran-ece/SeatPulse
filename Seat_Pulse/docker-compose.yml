
services:

  redis:
    image: redis:alpine
    container_name: seatpulse-redis
    restart: always
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: seatpulse-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seatpulse-backend
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - rabbitmq
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL:jdbc:mysql://mysql-32c8faf2-ashwinmahendran441-4490.i.aivencloud.com:21474/defaultdb?ssl-mode=REQUIRED
      - SPRING_DATASOURCE_USERNAME:avnadmin
      - SPRING_DATASOURCE_PASSWORD:${AIVEN_DB_PASSWORD}
      - SPRING_REDIS_HOST=redis
      - SPRING_RABBITMQ_HOST=rabbitmq

  # 5. React Frontend
  frontend:
    build:
      context: ../seatpulse-ui
      dockerfile: Dockerfile
    container_name: seatpulse-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data: