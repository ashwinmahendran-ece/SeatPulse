
services:
  mysql:
    image: mysql:8.0
    container_name: seatpulse-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: seat_pulse
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: seatpulse-redis
    restart: always
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: seatpulse-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seatpulse-backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
      - rabbitmq
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/seat_pulse?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_REDIS_HOST=redis
      - SPRING_RABBITMQ_HOST=rabbitmq

  # 5. React Frontend
  frontend:
    build:
      context: ../seatpulse-ui
      dockerfile: Dockerfile
    container_name: seatpulse-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data: